<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 經典線上遊戲</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap');

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 遊戲方塊顏色定義 */
        .tile-2 { background-color: #eee4da; color: #776e65; }
        .tile-4 { background-color: #ede0c8; color: #776e65; }
        .tile-8 { background-color: #f2b179; color: #f9f6f2; }
        .tile-16 { background-color: #f59563; color: #f9f6f2; }
        .tile-32 { background-color: #f67c5f; color: #f9f6f2; }
        .tile-64 { background-color: #f65e3b; color: #f9f6f2; }
        .tile-128 { background-color: #edcf72; color: #f9f6f2; box-shadow: 0 0 10px 1px rgba(237, 207, 114, 0.47); }
        .tile-256 { background-color: #edcc61; color: #f9f6f2; box-shadow: 0 0 10px 3px rgba(237, 207, 114, 0.5); }
        .tile-512 { background-color: #edc850; color: #f9f6f2; box-shadow: 0 0 15px 5px rgba(237, 207, 114, 0.6); }
        .tile-1024 { background-color: #edc53f; color: #f9f6f2; box-shadow: 0 0 20px 8px rgba(237, 207, 114, 0.7); }
        .tile-2048 { background-color: #edc22e; color: #f9f6f2; box-shadow: 0 0 25px 10px rgba(237, 207, 114, 0.8); }
        .tile-super { background-color: #3c3a32; color: #f9f6f2; }

        /* 出現與合併動畫 */
        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .tile-appear {
            animation: pop 0.2s ease-in-out forwards;
        }

        @keyframes merge {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .tile-merged {
            animation: merge 0.15s ease-in-out;
        }
    </style>
</head>
<body class="bg-[#faf8ef] text-[#776e65] min-h-screen flex flex-col items-center justify-between p-4">

    <!-- 主要容器 -->
    <div class="w-full max-w-md flex flex-col gap-4">
        
        <!-- 頂部標題與分數區 -->
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-5xl font-black tracking-wider text-[#776e65]">2048</h1>
                <p class="text-sm font-semibold text-[#8f7a66] mt-1">合併數字以拿到 <span class="font-bold">2048</span>！</p>
            </div>
            
            <div class="flex gap-2">
                <!-- 目前分數 -->
                <div class="bg-[#bbada0] rounded-xl px-4 py-2 text-center min-w-[75px]">
                    <div class="text-xs uppercase tracking-wider text-[#eee4da] font-bold">分數</div>
                    <div id="score" class="text-xl font-bold text-white">0</div>
                </div>
                <!-- 最高分數 -->
                <div class="bg-[#bbada0] rounded-xl px-4 py-2 text-center min-w-[75px]">
                    <div class="text-xs uppercase tracking-wider text-[#eee4da] font-bold">最高</div>
                    <div id="best-score" class="text-xl font-bold text-white">0</div>
                </div>
            </div>
        </div>

        <!-- 功能按鈕區 -->
        <div class="flex justify-between items-center">
            <button id="undo-btn" class="bg-[#8f7a66] hover:bg-[#9f8a76] active:scale-95 text-white font-bold py-2 px-4 rounded-lg flex items-center gap-2 transition disabled:opacity-40 disabled:pointer-events-none">
                <i class="fa-solid font-bold fa-rotate-left"></i> 上一步
            </button>
            <button id="restart-btn" class="bg-[#8f7a66] hover:bg-[#9f8a76] active:scale-95 text-white font-bold py-2 px-4 rounded-lg flex items-center gap-2 transition">
                <i class="fa-solid fa-arrows-rotate"></i> 新遊戲
            </button>
        </div>

        <!-- 遊戲棋盤區域 -->
        <div class="relative bg-[#bbada0] p-3 rounded-2xl aspect-square w-full shadow-lg">
            
            <!-- 棋盤底格 (4x4 網格) -->
            <div id="grid-background" class="grid grid-cols-4 grid-rows-4 gap-3 w-full h-full">
                <!-- 16個背景底格 -->
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
                <div class="bg-[#ccc0b4] rounded-xl"></div>
            </div>

            <!-- 動態數字方塊容器 -->
            <div id="tile-container" class="absolute inset-0 p-3 grid grid-cols-4 grid-rows-4 gap-3 pointer-events-none">
                <!-- 數字方塊將會透過 JavaScript 動態生成於此 -->
            </div>

            <!-- 遊戲結束 Overlay -->
            <div id="game-over-modal" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 text-center z-20 animate-fade-in">
                <h2 id="game-over-title" class="text-4xl font-black text-[#776e65] mb-2">遊戲結束！</h2>
                <p id="game-over-desc" class="text-lg text-[#8f7a66] mb-6">沒有合適的移動步數了。</p>
                <button id="modal-restart-btn" class="bg-[#8f7a66] hover:bg-[#7f6a56] text-white font-bold py-3 px-8 rounded-xl shadow-md transform active:scale-95 transition">
                    再試一次
                </button>
            </div>

            <!-- 勝利 Overlay -->
            <div id="game-win-modal" class="hidden absolute inset-0 bg-[#edc22e]/90 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 text-center z-20">
                <h2 class="text-5xl font-black text-white mb-2 drop-shadow">你贏了！🎉</h2>
                <p class="text-lg text-white/90 mb-6 font-semibold">恭喜順利合成出 2048 方塊！</p>
                <div class="flex gap-3">
                    <button id="keep-going-btn" class="bg-white text-[#776e65] hover:bg-gray-100 font-bold py-3 px-5 rounded-xl shadow-md transform active:scale-95 transition">
                        繼續挑戰
                    </button>
                    <button id="win-restart-btn" class="bg-[#776e65] text-white hover:bg-[#675e55] font-bold py-3 px-5 rounded-xl shadow-md transform active:scale-95 transition">
                        重新開始
                    </button>
                </div>
            </div>
        </div>

        <!-- 遊戲操作提示 -->
        <div class="bg-[#eee4da]/60 rounded-xl p-4 text-xs sm:text-sm text-[#776e65] leading-relaxed">
            <p class="font-bold mb-1"><i class="fa-solid fa-lightbulb text-yellow-600"></i> 遊玩說明：</p>
            <p>使用 <strong>鍵盤方向鍵 (↑ ↓ ← →)</strong> 或 <strong>WASD</strong> 來移動方塊。在手機/平板上可使用 <strong>滑動手勢</strong>。當兩個相同數字的方塊相撞時，會融合成一個雙倍數字的方塊！</p>
        </div>

    </div>

    <!-- 頁尾 -->
    <footer class="mt-6 text-center text-xs text-[#8f7a66]">
        2048 經典線上版 &copy; 2026
    </footer>

    <!-- 遊戲邏輯 JS -->
    <script>
        const GRID_SIZE = 4;
        let board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('2048_best_score')) || 0;
        let previousState = null; // 用於上一步 Undo
        let hasWon = false;
        let keepPlaying = false;

        // DOM 元素引用
        const tileContainer = document.getElementById('tile-container');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const undoBtn = document.getElementById('undo-btn');
        const restartBtn = document.getElementById('restart-btn');
        const gameOverModal = document.getElementById('game-over-modal');
        const gameWinModal = document.getElementById('game-win-modal');
        const keepGoingBtn = document.getElementById('keep-going-btn');
        const winRestartBtn = document.getElementById('win-restart-btn');
        const modalRestartBtn = document.getElementById('modal-restart-btn');

        // 初始化遊戲
        function initGame() {
            board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
            score = 0;
            previousState = null;
            hasWon = false;
            keepPlaying = false;
            
            updateScore(0);
            bestScoreEl.textContent = bestScore;
            undoBtn.disabled = true;
            
            gameOverModal.classList.add('hidden');
            gameWinModal.classList.add('hidden');

            // 產生兩個初始數字方塊
            addRandomTile();
            addRandomTile();
            renderBoard();
        }

        // 保存當前狀態用於 Undo
        function saveState() {
            previousState = {
                board: board.map(row => [...row]),
                score: score
            };
            undoBtn.disabled = false;
        }

        // 執行復原 (Undo)
        function undo() {
            if (!previousState) return;
            board = previousState.board.map(row => [...row]);
            score = previousState.score;
            previousState = null;
            undoBtn.disabled = true;
            
            gameOverModal.classList.add('hidden');
            updateScore(0);
            renderBoard();
        }

        // 更新分數與最高分
        function updateScore(amount) {
            score += amount;
            scoreEl.textContent = score;
            
            if (score > bestScore) {
                bestScore = score;
                bestScoreEl.textContent = bestScore;
                localStorage.setItem('2048_best_score', bestScore);
            }
        }

        // 在空白格子隨機生成新方塊 (2 或 4)
        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] === 0) {
                        emptyCells.push({ r, c });
                    }
                }
            }

            if (emptyCells.length > 0) {
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomCell.r][randomCell.c] = Math.random() < 0.9 ? 2 : 4;
                return randomCell;
            }
            return null;
        }

        // 渲染遊戲棋盤畫面
        function renderBoard(mergedCoords = []) {
            tileContainer.innerHTML = '';

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let value = board[r][c];
                    if (value !== 0) {
                        let tile = document.createElement('div');
                        let tileClass = value <= 2048 ? `tile-${value}` : 'tile-super';
                        
                        tile.className = `w-full h-full rounded-xl flex items-center justify-center font-bold text-2xl sm:text-3xl transition-all duration-100 ${tileClass}`;
                        
                        // 根據字數調整字體大小
                        if (value >= 1024) {
                            tile.classList.remove('text-2xl', 'sm:text-3xl');
                            tile.classList.add('text-lg', 'sm:text-xl');
                        } else if (value >= 100) {
                            tile.classList.remove('text-2xl', 'sm:text-3xl');
                            tile.classList.add('text-xl', 'sm:text-2xl');
                        }

                        tile.textContent = value;
                        
                        // 動畫判斷
                        if (mergedCoords.some(coord => coord.r === r && coord.c === c)) {
                            tile.classList.add('tile-merged');
                        }

                        tileContainer.appendChild(tile);
                    } else {
                        // 佔位用空 Div 保障 Grid 排版
                        let emptyDiv = document.createElement('div');
                        tileContainer.appendChild(emptyDiv);
                    }
                }
            }
        }

        // 滑動邏輯 (核心演算法)
        function slide(row) {
            // 1. 濾除 0
            let arr = row.filter(val => val !== 0);
            let mergedIndices = [];
            let gainedScore = 0;

            // 2. 合併相同相鄰數字
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    gainedScore += arr[i];
                    arr[i + 1] = 0;
                    if (arr[i] === 2048 && !hasWon && !keepPlaying) {
                        hasWon = true;
                    }
                }
            }

            // 3. 再次濾除 0 並補齊陣列至長度 4
            arr = arr.filter(val => val !== 0);
            while (arr.length < GRID_SIZE) {
                arr.push(0);
            }

            return { newRow: arr, scoreGained: gainedScore };
        }

        // 移動盤面 (方向: 'left', 'right', 'up', 'down')
        function move(direction) {
            let moved = false;
            let totalGainedScore = 0;
            let tempBoard = board.map(row => [...row]);

            if (direction === 'left' || direction === 'right') {
                for (let r = 0; r < GRID_SIZE; r++) {
                    let row = tempBoard[r];
                    if (direction === 'right') row.reverse();

                    let res = slide(row);
                    let newRow = res.newRow;
                    totalGainedScore += res.scoreGained;

                    if (direction === 'right') newRow.reverse();

                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (tempBoard[r][c] !== newRow[c]) {
                            moved = true;
                        }
                        tempBoard[r][c] = newRow[c];
                    }
                }
            } else if (direction === 'up' || direction === 'down') {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let col = [tempBoard[0][c], tempBoard[1][c], tempBoard[2][c], tempBoard[3][c]];
                    if (direction === 'down') col.reverse();

                    let res = slide(col);
                    let newCol = res.newRow;
                    totalGainedScore += res.scoreGained;

                    if (direction === 'down') newCol.reverse();

                    for (let r = 0; r < GRID_SIZE; r++) {
                        if (tempBoard[r][c] !== newCol[r]) {
                            moved = true;
                        }
                        tempBoard[r][c] = newCol[r];
                    }
                }
            }

            if (moved) {
                saveState(); // 紀錄前一次狀態
                board = tempBoard;
                updateScore(totalGainedScore);
                addRandomTile();
                renderBoard();

                if (hasWon && !keepPlaying) {
                    gameWinModal.classList.remove('hidden');
                } else if (checkGameOver()) {
                    gameOverModal.classList.remove('hidden');
                }
            }
        }

        // 檢查是否遊戲結束
        function checkGameOver() {
            // 還有空位則未結束
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] === 0) return false;
                }
            }

            // 檢查水平或垂直方向是否有可合併的相鄰數字
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let current = board[r][c];
                    if (c + 1 < GRID_SIZE && current === board[r][c + 1]) return false;
                    if (r + 1 < GRID_SIZE && current === board[r + 1][c]) return false;
                }
            }

            return true;
        }

        // 鍵盤操作監聽
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    move('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    move('right');
                    break;
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    move('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    move('down');
                    break;
            }
        });

        // 手勢（Touch/Swipe）支援
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        const boardContainer = document.getElementById('grid-background').parentElement;

        boardContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        boardContainer.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            // 設定最小滑動距離門檻
            if (Math.max(absDx, absDy) > 30) {
                if (absDx > absDy) {
                    // 水平滑動
                    if (dx > 0) {
                        move('right');
                    } else {
                        move('left');
                    }
                } else {
                    // 垂直滑動
                    if (dy > 0) {
                        move('down');
                    } else {
                        move('up');
                    }
                }
            }
        }

        // 按鈕事件監聽
        restartBtn.addEventListener('click', initGame);
        modalRestartBtn.addEventListener('click', initGame);
        winRestartBtn.addEventListener('click', initGame);
        undoBtn.addEventListener('click', undo);

        keepGoingBtn.addEventListener('click', () => {
            keepPlaying = true;
            gameWinModal.classList.add('hidden');
        });

        // 啟動遊戲
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
